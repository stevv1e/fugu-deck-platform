name: platform-images
on:
  push:
    branches: [main]
    paths: ["images/**", ".github/workflows/platform-images.yaml"]
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
  id-token: write
concurrency:
  group: platform-images
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: squid, tag: noble}
          - {name: keycloak, tag: "26.7.5"}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: sigstore/cosign-installer@v4.1.2
        with: {cosign-release: v2.6.5}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: images/${{ matrix.name }}
          push: true
          pull: true
          tags: ghcr.io/${{ steps.owner.outputs.lc }}/deck-${{ matrix.name }}:${{ matrix.tag }}
          provenance: false
      - name: Sign by digest
        run: cosign sign --yes "ghcr.io/${{ steps.owner.outputs.lc }}/deck-${{ matrix.name }}@${{ steps.build.outputs.digest }}"
      - name: Verify signature identity
        run: |
          cosign verify "ghcr.io/${{ steps.owner.outputs.lc }}/deck-${{ matrix.name }}@${{ steps.build.outputs.digest }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/platform-images.yaml@${GITHUB_REF}" >/dev/null
          echo "deck-${{ matrix.name }}:${{ matrix.tag }} digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
