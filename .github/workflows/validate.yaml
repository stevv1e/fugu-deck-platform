name: validate
on:
  pull_request: {}
  push: {branches: [main]}
  workflow_dispatch: {}
permissions: {contents: read}
jobs:
  go:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        component: [keyguard, control-plane, space-operator, ssh-gateway]
    steps:
      - uses: actions/checkout@v7
      - if: matrix.component == 'keyguard'
        name: Public Space backend for Git allowlist cross-check
        uses: actions/checkout@v7
        with:
          repository: stevv1e/fugu-deck-app
          path: fugu-deck-app
      - uses: actions/setup-go@v6
        with: {go-version: "1.26"}
      - name: Formatting
        run: test -z "$(gofmt -l .)"
        working-directory: ${{ matrix.component }}
      - run: go vet ./...
        working-directory: ${{ matrix.component }}
      - run: go test -race ./...
        working-directory: ${{ matrix.component }}
  keycloak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with: {go-version: "1.26"}
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: python -m pip install pyyaml
      - run: sudo apt-get update && sudo apt-get install -y jq
      - run: ./test.sh
        working-directory: images/keycloak
