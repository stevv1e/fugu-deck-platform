# space-operator: создаёт, усыпляет и удаляет пространства. Входа из интернета нет (architecture.md, 3.10).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: space-operator
  namespace: deck-system
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: deck:space-operator
rules:
  - apiGroups: [deck.fugu]
    resources: [spaces, spaces/status, spaces/finalizers]
    verbs: [get, list, watch, update, patch, delete]
  # Namespace: удалять можно только deck-u-*/deck-t-* (правило допуска deck-guard-namespaces),
  # а писать — только в них (deck-space-operator-scope).
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [resourcequotas, limitranges, persistentvolumeclaims, services, serviceaccounts, configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  # Секреты space-* (доступ Litestream) — только запись, без чтения: секреты платформы оператор не видит.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments/scale]
    verbs: [get, update, patch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [traefik.io]
    resources: [ingressroutes, middlewares]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["", events.k8s.io]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: deck:space-operator
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: "deck:space-operator"}
subjects:
  - {kind: ServiceAccount, name: space-operator, namespace: deck-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: space-operator-leader
  namespace: deck-system
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: space-operator-leader
  namespace: deck-system
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: space-operator-leader}
subjects:
  - {kind: ServiceAccount, name: space-operator, namespace: deck-system}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: space-operator
  namespace: deck-system
  labels: {app.kubernetes.io/name: space-operator, app.kubernetes.io/part-of: fugu-deck}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app.kubernetes.io/name: space-operator}
  template:
    metadata:
      labels: {app.kubernetes.io/name: space-operator, app.kubernetes.io/part-of: fugu-deck}
    spec:
      serviceAccountName: space-operator
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: space-operator
          image: ghcr.io/stevv1e/deck-space-operator:0.0.0
          ports:
            - {name: probes, containerPort: 8081}
          env:
            - {name: DECK_SPACE_IMAGE, value: "ghcr.io/stevv1e/deck-space:0.0.0"}
            - {name: DECK_DELETE_DELAY, value: "24h"}
            # Подпись запроса удаления (Space.spec.deleteSignature) проверяется через keyguard: /v1/actions/verify
            - {name: DECK_KEYGUARD_URL, value: "http://keyguard.deck-keys.svc.cluster.local:8080"}
            - {name: DECK_RUNTIME_CLASS, value: "gvisor"}
            - {name: DECK_SQUID_URL, value: "http://squid.deck-egress.svc.cluster.local:3128"}
            # Серверы пользователей агент видит только через ssh-gateway; пусто — у агентов нет доступа к серверам
            - {name: DECK_SSH_GATEWAY_URL, value: "http://ssh-gateway.deck-ssh.svc.cluster.local:8080"}
            # Резервные копии пространств: раз в DECK_BACKUP_EVERY оператор забирает у агента снимок базы и кладёт
            # его в бакет под ключом spaces/<имя>/. Ключ бакета есть только здесь; без бакета копии выключены.
            - {name: DECK_BACKUP_EVERY, value: "15m"}
            - {name: DECK_BACKUP_S3_ENDPOINT, value: "http://minio.minio.svc.cluster.local:9000"}
            - {name: DECK_BACKUP_S3_REGION, value: "us-east-1"}
            - name: DECK_BACKUP_S3_BUCKET
              valueFrom: {secretKeyRef: {name: space-backup-s3, key: BUCKET, optional: true}}
            - name: DECK_BACKUP_S3_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: space-backup-s3, key: ACCESS_KEY_ID, optional: true}}
            - name: DECK_BACKUP_S3_SECRET_KEY
              valueFrom: {secretKeyRef: {name: space-backup-s3, key: SECRET_ACCESS_KEY, optional: true}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /readyz, port: probes}
          livenessProbe:
            httpGet: {path: /healthz, port: probes}
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 384Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: keyguard-token, mountPath: /var/run/secrets/keyguard, readOnly: true}
      volumes:
        - {name: tmp, emptyDir: {}}
        # Токен для keyguard (audience=keyguard): им оператор представляется при проверке подписей
        - name: keyguard-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: keyguard
                  expirationSeconds: 600
                  path: token
