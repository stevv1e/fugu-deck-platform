apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: smoke-runner
  namespace: deck-u-smoke
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, delete, get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  # exec — только в песочнице: проверка сетевой изоляции изнутри пространства
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: smoke-runner
  namespace: deck-u-smoke
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: smoke-runner}
subjects:
  - {kind: ServiceAccount, name: smoke-tester, namespace: kube-system}
