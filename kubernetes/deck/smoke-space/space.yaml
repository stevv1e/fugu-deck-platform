# Песочница «как пространство»: те же ограничения, что будут у настоящих deck-u-*.
# Нужна для смоктестов изоляции (scripts/smoke-test.sh) и экспериментов. Создаётся вручную, а не space-operator,
# поэтому удалить её можно только через breakglass — это тоже проверка (правило deck-guard-namespaces).
apiVersion: v1
kind: Namespace
metadata:
  name: deck-u-smoke
  labels:
    deck.fugu/space: "true"
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: space
  namespace: deck-u-smoke
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.memory: 2Gi
    pods: "10"
    persistentvolumeclaims: "2"
    requests.storage: 4Gi
    services.loadbalancers: "0"
    services.nodeports: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: space
  namespace: deck-u-smoke
spec:
  limits:
    - type: Container
      default: {memory: 256Mi, cpu: 500m}
      defaultRequest: {memory: 64Mi, cpu: 50m}
      max: {memory: 600Mi}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: deck-u-smoke
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# Так будет у каждого пространства: внутрь — Traefik и control-plane; наружу — DNS, keyguard, ssh-gateway, Squid.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: space
  namespace: deck-u-smoke
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - {key: kubernetes.io/metadata.name, operator: In, values: [traefik, deck-system]}
      ports: [{port: 8080, protocol: TCP}]
  egress:
    # DNS — только к space-dns (cluster.local, без форвардинга наружу). kube-dns запрещён:
    # он форвардит внешние имена и был бы каналом DNS-эксфильтрации данных пространства.
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: deck-egress}}
          podSelector: {matchLabels: {app.kubernetes.io/name: space-dns}}
      ports: [{port: 1053, protocol: UDP}, {port: 1053, protocol: TCP}]   # порт пода (NP смотрит после DNAT)
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: deck-keys}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: deck-ssh}}
      ports: [{port: 8080, protocol: TCP}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: deck-egress}}
          podSelector: {matchLabels: {app.kubernetes.io/name: squid}}
      ports: [{port: 3128, protocol: TCP}]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: space
  namespace: deck-u-smoke
automountServiceAccountToken: false
---
# Пробное «пространство»: веб-сервер в gVisor.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: deck-u-smoke
  labels: {app.kubernetes.io/name: echo}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: echo}
  template:
    metadata:
      labels: {app.kubernetes.io/name: echo}
    spec:
      runtimeClassName: gvisor
      serviceAccountName: space
      automountServiceAccountToken: false
      # DNS только через space-dns (cluster.local, без выхода наружу).
      dnsPolicy: None
      dnsConfig:
        nameservers: ["10.43.0.53"]
        searches: [deck-u-smoke.svc.cluster.local, svc.cluster.local, cluster.local]
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: echo
          image: docker.io/nginxinc/nginx-unprivileged:alpine
          ports: [{name: http, containerPort: 8080}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: deck-u-smoke
spec:
  selector: {app.kubernetes.io/name: echo}
  ports: [{name: http, port: 8080, targetPort: http}]
